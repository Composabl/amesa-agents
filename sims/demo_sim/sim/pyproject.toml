[project]
name = "amesa-sim-demo"
version = "0.1.0"
description = "Demo simulator with multiple space types for testing and validation"
authors = [{ name = "Amesa", email = "support@amesa.ai" }]
dependencies = [
    "amesa-core",
    "gymnasium",
    "numpy",
    "simpy==4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["demo_sim"]
exclude = ["demo_sim.rllib*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.pkl"]

[amesa]
type = "sim"
entrypoint = "demo_sim.sim_impl:SimImpl"
dependencies_system = []